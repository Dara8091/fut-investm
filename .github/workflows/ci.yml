name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test
  DB_TYPE: sqlite
  DB_PATH: ':memory:'
  JWT_SECRET: test-secret-ci
  TOTP_SECRET: test-totp-secret-ci
  APP_SECRET: test-app-secret-ci

jobs:
  # Backend Tests
  backend-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run linter
        working-directory: ./backend
        run: npm run lint || true
      
      - name: Run tests
        working-directory: ./backend
        run: npm test
      
      - name: Run tests with coverage
        working-directory: ./backend
        run: npm run test:coverage
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          directory: ./backend/coverage
          fail_ci_if_error: false

  # Frontend Build
  frontend-build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build frontend
        run: npm run build
      
      - name: Verify build
        run: npm run test:frontend
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            index.html
            style.css
            app.js
            config.js
            public/

  # Security Audit
  security-audit:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run security audit
        working-directory: ./backend
        run: npm audit --audit-level=high || true
      
      - name: Check for known vulnerabilities
        uses: oke-py/npm-audit-action@v1
        with:
          working_directory: ./backend
          audit_level: high

  # Docker Build (only on main branch)
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: futinvest-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Verify docker-compose
        run: docker compose config

  # Deploy (only on main branch, all tests pass)
  deploy:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, security-audit, docker-build]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to production
        run: |
          echo "🚀 Deploy triggered"
          echo "Add your deployment steps here"
          echo "- SSH to server"
          echo "- Pull latest code"
          echo "- Run docker compose up -d"
          echo "- Run database migrations"
          echo "- Verify health check"
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
