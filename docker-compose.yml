version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: futinvest-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: futinvest
      POSTGRES_USER: ${DB_USER:-futinvest}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-futinvest}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - futinvest-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: futinvest-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_TYPE: postgres
      DATABASE_URL: postgresql://${DB_USER:-futinvest}:${DB_PASSWORD:-changeme}@postgres:5432/futinvest
      JWT_SECRET: ${JWT_SECRET}
      TOTP_SECRET: ${TOTP_SECRET}
      APP_SECRET: ${APP_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WAF_ENABLED: "true"
      CSRF_ENABLED: "true"
      METRICS_ENABLED: "true"
      FUTINVEST_ENABLED: "true"
      FUTINVEST_AUTO_EXECUTE: "false"
      PYTHON_SERVICES_ENABLED: "false"
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs
      - ./backups:/app/backups
    networks:
      - futinvest-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Nginx)
  frontend:
    image: nginx:alpine
    container_name: futinvest-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html
      - ./style.css:/usr/share/nginx/html/style.css
      - ./app.js:/usr/share/nginx/html/app.js
      - ./config.js:/usr/share/nginx/html/config.js
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - futinvest-network

  # Python Services (Optional)
  python-services:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: futinvest-python
    restart: unless-stopped
    environment:
      PYTHON_SERVICES_PORT: 3002
    ports:
      - "3002:3002"
    profiles:
      - python
    networks:
      - futinvest-network

  # Backup Service (Daily backups at 2am)
  backup:
    image: alpine:latest
    container_name: futinvest-backup
    volumes:
      - postgres_data:/var/lib/postgresql/data:ro
      - ./backups:/backups
      - ./backend/scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "while true; do
        if [ $(date +\%H) -eq 2 ] && [ $(date +\%M) -eq 0 ]; then
          /backup.sh;
          sleep 60;
        fi;
        sleep 30;
      done"
    profiles:
      - backup
    networks:
      - futinvest-network

volumes:
  postgres_data:

networks:
  futinvest-network:
    driver: bridge
