<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Página no encontrada | fut.invest</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0A0E1A;
            color: #E8ECF4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container { max-width: 500px; padding: 40px 20px; }
        .logo { font-size: 24px; font-weight: 800; margin-bottom: 40px; background: linear-gradient(135deg, #00D4FF, #00FF88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .error-code { font-size: 120px; font-weight: 900; background: linear-gradient(135deg, #00D4FF, #00FF88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; margin-bottom: 16px; }
        h1 { font-size: 24px; margin-bottom: 12px; }
        p { color: #8B95A8; margin-bottom: 32px; line-height: 1.6; }
        .btn { display: inline-block; padding: 12px 32px; background: linear-gradient(135deg, #00D4FF, #00FF88); color: #0A0E1A; text-decoration: none; border-radius: 8px; font-weight: 600; transition: transform 0.2s; }
        .btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">fut.invest</div>
        <div class="error-code">404</div>
        <h1>Página no encontrada</h1>
        <p>La página que buscas no existe o ha sido movida. Verifica la URL o regresa al inicio.</p>
        <a href="/" class="btn">Volver al inicio</a>
    </div>
</body>
</html>
